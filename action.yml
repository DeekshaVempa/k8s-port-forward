---
name: Kubernetes port-forward (Multiple Services)
author: '@DeekshaVempa'
description: Forward local ports to multiple workloads in Kubernetes
branding:
  icon: truck
  color: green

inputs:
  config_file:
    description: 'Path to a JSON file with workloads and port mappings'
    required: true
  sleep:
    description: 'Seconds to wait before action finishes (default: 3)'
    required: false
    default: '3'

outputs:
  pids:
    description: 'Process IDs of all port-forward daemons'
    value: ${{ steps.main.outputs.pids }}
  logs:
    description: 'Paths to port-forward log files'
    value: ${{ steps.main.outputs.logs }}

runs:
  using: composite
  steps:
    - id: main
      shell: bash
      run: |
        # Function to log grouped messages
        function kit::wf::group {
            echo "::group::$1"      >&2
            echo "$(< /dev/stdin)"  >&2
            echo '::endgroup::'     >&2
        }

        # Function to set output variables
        function kit::wf::output {
            local val
            val="$(< /dev/stdin)"
            {
                echo "$1<<__GITHUB_OUTPUT__"
                echo "$val"
                echo '__GITHUB_OUTPUT__'
            } >> "$GITHUB_OUTPUT"
            kit::wf::group "🖨️ step output '$1' has been set" <<< "${2:-$val}"
        }

        PIDS=()
        LOGS=()

        # Read and parse JSON config
        while IFS= read -r line; do
            workload=$(echo "$line" | jq -r '.workload')
            mappings=$(echo "$line" | jq -r '.mappings')
            options=$(echo "$line" | jq -r '.options // ""')

            LOG_FILE="${{ runner.temp }}/k8s-pod-forward-${workload//\//-}.$RANDOM.log"

            kit::wf::group "🚢 Starting port-forward for $workload" <<< "kubectl port-forward '$workload' $mappings $options"
            nohup kubectl port-forward "$workload" $mappings $options \
              < /dev/null &> "$LOG_FILE" &

            PIDS+=("$!")
            LOGS+=("$LOG_FILE")
        done < <(jq -c '.[]' "${{ inputs.config_file }}")

        # Store PIDs and log paths as output
        kit::wf::output 'pids' <<< "$(IFS=,; echo "${PIDS[*]}")"
        kit::wf::output 'logs' <<< "$(IFS=,; echo "${LOGS[*]}")"

        sleep '${{ inputs.sleep }}'

        # Display logs for all workloads
        for log in "${LOGS[@]}"; do
            kit::wf::group "🚢 Log for $log" < "$log"
        done
